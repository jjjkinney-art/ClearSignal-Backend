[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Hang prevention is BUILT INTO conftest.py via threading.Timer.
# pytest-timeout plugin is OPTIONAL — conftest watchdog runs without it.
# pytest-asyncio is OPTIONAL — install if running @pytest.mark.asyncio tests.

filterwarnings =
    ignore::DeprecationWarning:pydantic.*
    ignore::PendingDeprecationWarning

addopts =
    -ra
    --tb=short

markers =
    slow: tests that take >5s
    integration: tests that exercise multiple services
    enterprise: enterprise-layer tests
    asyncio: async test
    timeout: test-specific timeout
