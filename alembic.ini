# Alembic configuration (Sprint 1A).
#
# The database URL is NOT stored here — env.py resolves it at runtime from
# settings.database_url (env / .env), falling back to the sqlalchemy.url below
# (kept empty). This keeps credentials out of version control.
#
# Usage:
#   alembic upgrade head        # apply all migrations (deploy step)
#   alembic current             # show the DB's current revision
#   alembic history             # show the migration history
#   alembic stamp head          # mark an already-current DB without running DDL
#   alembic downgrade -1        # revert one migration (see docstrings for limits)

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# Resolved dynamically in env.py; leave empty here.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
